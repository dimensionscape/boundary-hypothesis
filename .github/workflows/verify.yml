name: Verify manuscript and calculations

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install numerical dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify executable appendix and manuscript
        run: python scripts/check_manuscript.py
      - name: Verify supplemental calculations
        run: |
          python scripts/audits/quantum_gain.py
          python scripts/audits/response_structure.py
          python scripts/audits/biased_stabilization.py
          python scripts/audits/past_persistence.py
